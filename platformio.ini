; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-mini-FH4R2

[base]
platform = espressif32
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = deep+
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
	-I src/config
	-I src/include
	-I src/lib
	-I src/lib/modules

extra_scripts = myscript.py
	; post:gzipper.py
	pre:jsonFileToString.py

lib_deps = 
	littlemanbuilds/ESP32_MCPWM@^1.0.0
	esp32async/ESPAsyncWebServer @ ^3.7.8
	bblanchon/ArduinoJson@^7.4.2
	fastled/FastLED@^3.9.13
	khoih-prog/ESP32TimerInterrupt @ ^2.3.0


[env:esp32-s3-devkitc-1]
extends = base
board = esp32-s3-devkitc-1
board_build.psram_type = qio
board_build.arduino.memory_type = qio_qspi ;qio_opi causes board to crash
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.extra_flags = 
	-DBOARD_HAS_PSRAM
lib_ldf_mode = chain+
build_flags =
	${base.build_flags}
	-D ARDUINO_USB_MODE=1

[env:esp32-s3-mini-FH4R2]
extends = base
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
board_build.extra_flags = 
  -DBOARD_HAS_PSRAM
lib_ldf_mode = chain+
build_flags =
	${base.build_flags}
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1

	 